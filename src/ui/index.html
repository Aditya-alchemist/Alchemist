<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'" />
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: "Segoe UI", sans-serif; color: #e8ecf3; user-select: none;
  }
  .card {
    position: absolute; inset: 12px; border-radius: 20px;
    background: rgba(18, 20, 28, 0.97);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 16px 10px; -webkit-app-region: drag;
  }
  .orb {
    width: 36px; height: 36px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 35% 30%, #8be9ff, #3b82f6 60%, #1d3a8a);
    transform: scale(calc(1 + var(--lvl, 0) * 0.4));
    transition: transform 0.08s;
  }
  .orb.thinking { animation: pulse 0.9s ease-in-out infinite; }
  .orb.speaking { animation: pulse 1.6s ease-in-out infinite; }
  .orb.idle { filter: grayscale(0.8); opacity: 0.7; }
  @keyframes pulse { 50% { transform: scale(1.18); opacity: 0.8; } }
  .title { flex: 1; }
  .title b { display: block; font-size: 15px; }
  .title span { font-size: 12px; color: #8b93a7; }
  .x {
    -webkit-app-region: no-drag; border: 0; background: transparent;
    color: #8b93a7; font-size: 18px; cursor: pointer; border-radius: 8px;
    width: 32px; height: 32px;
  }
  .x:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
  #log {
    flex: 1; overflow-y: auto; padding: 8px 16px; display: flex;
    flex-direction: column; gap: 8px; user-select: text;
  }
  .msg { padding: 9px 13px; border-radius: 14px; font-size: 14px; line-height: 1.4; max-width: 88%; }
  .msg.user { align-self: flex-end; background: #2b5fd9; }
  .msg.bot { align-self: flex-start; background: #262a38; }
  .msg.sys { align-self: center; color: #f0a8a8; font-size: 12px; text-align: center; }
  #confirm { margin: 0 16px 8px; padding: 12px; border-radius: 14px; background: #332b17; border: 1px solid #6b5521; }
  #confirm p { margin: 0 0 10px; font-size: 13px; line-height: 1.4; word-break: break-word; }
  #confirm button { border: 0; border-radius: 8px; padding: 7px 18px; margin-right: 8px; font-size: 13px; cursor: pointer; color: #fff; }
  #yes { background: #2f9e5b; } #no { background: #8a3a3a; }
  footer { padding: 8px 16px 14px; font-size: 11px; color: #6b7389; text-align: center; }
</style>
</head>
<body>
  <div class="card">
    <header>
      <div id="orb" class="orb idle"></div>
      <div class="title"><b>Alchemist</b><span id="status">Ready</span></div>
      <button class="x" id="closeBtn" title="Close">&#x2715;</button>
    </header>
    <div id="log"></div>
    <div id="confirm" hidden>
      <p id="confirmText"></p>
      <button id="yes">Yes</button><button id="no">No</button>
    </div>
    <footer>Ctrl+Alt+A to dismiss &middot; say &ldquo;close chat&rdquo;</footer>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
